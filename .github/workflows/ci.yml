name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux && tmux -V
      - run: npm ci
      - run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; the browser test keeps the Chromium sandbox on.
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run test:browser
